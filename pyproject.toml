[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "lazyslide"
description = "Accessible and interoperable whole slide image analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Yimin Zheng", email = "yzheng@cemm.at"},
    {name = "Ernesto Abila", email = "eabila@cemm.at"},
    {name = "André F. Rendeiro", email = "arendeiro@cemm.at"},
]
keywords = ["histopathology", "whole slide image", "image analysis", "segmentation", "deep learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = [
    "wsidata>=0.12.0",
    "scikit-learn>=1.0",
    "matplotlib>=3.9.0",
    "matplotlib-scalebar>=0.9.0",
    "legendkit>=0.3.4",
    "rich>=13.0.0",
    "torch>=2.0.0",
    "torchvision>=0.16",
    "seaborn>=0.12.2",
    "psutil>=5.9.0",
    "scikit-image>=0.23.1",
    "scipy>=1.15.1",
    "numba>=0.60.0",
    "huggingface-hub>=0.34.0",  # first release with the `hf` CLI the docs use
    "lazyslide-models>=0.1.0",
]

[project.urls]
Documentation = "https://lazyslide.readthedocs.io"
Repository = "https://github.com/rendeirolab/lazyslide"

[project.optional-dependencies]
all = [
    "scanpy>=1.10.4",
    "igraph>=0.11.8",
]
models = [
    "einops>=0.8.1",
    "einops-exts>=0.0.4",
    "environs>=14.1.1",
    "sacremoses>=0.1.1",
    "transformers>=4.49.0",
    "open-clip-torch>=2.32.0",
]
docker = [
    "jupyterlab",
    "ipython",
    "torchstain",
    "scanpy",
    "spatialdata-plot",
    "scyjava",
    "cucim",
    "hf-xet",
    "igraph",
    "ipywidgets",
    "marsilea",
    "mpl-fontkit",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "docs",
    "data",
    "assets",
    "tests",
    "scripts",
    ".readthedocs.yaml",
    ".github",
    ".gitignore",
]
include = [
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "src/lazyslide",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lazyslide", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/lazyslide/_version.py"
template = '''
version = "{version}"
'''

[tool.ruff]
line-length = 88
# target-version deliberately unset: ruff infers it from project.requires-python,
# keeping one source of truth for the minimum supported Python.

[tool.ruff.lint]
# ARG: an unused argument in the library is a parameter that silently does nothing
extend-select = ["I", "ARG"]

[tool.ruff.lint.per-file-ignores]
# BLE001 (blind except). Deliberate in these files:
#   _annotation.py  - optional defusedxml import, falls back to stdlib ElementTree
#   _zero_shot.py   - per-prompt resilience in a batch loop, logs and degrades
#   conf.py         - docs build should not die on one failed model lookup
"docs/source/conf.py" = ["BLE001"]
"src/lazyslide/io/_annotation.py" = ["BLE001"]
"src/lazyslide/segmentation/_zero_shot.py" = ["BLE001"]
# B017: these tests assert that *some* error surfaces from a third-party call
# (geopandas, torch) whose exact exception type is not part of our contract.
# ARG: mocks, fixtures and Sphinx hooks implement signatures they don't fully use.
"tests/**" = ["B017", "ARG"]
"docs/**" = ["ARG"]
"scripts/**" = ["ARG"]

[tool.taskipy.tasks]
test = "pytest tests -n 4 -v --tb=short --cov=src/lazyslide --cov-report=xml --cov-report=html"
doc-build = "sphinx-build -b html -j auto -T docs/source docs/build"
doc-clean-build = "python docs/clean_up.py && sphinx-build -b html -j auto -T docs/source docs/build"
doc-serve = "python -m http.server -d docs/build"
fmt = "ruff format ."
lint = "ruff check --fix ."

[tool.uv]
default-groups = ["dev", "tests", "docs", "tutorials", "model"]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true }}]

[dependency-groups]
dev = [
    "cyclopts>=3.0.0",  # scripts/tag_datasets.py, run by the release workflow
    "jupyterlab>=4.3.5",
    "prek>=0.3.0",
    "ruff>=0.16.5,<0.17",
    "taskipy>=1.14.1",
    "torchvision>=0.21.0",
    "matplotlib>=3.10.0",
    "matplotlib-scalebar>=0.9.0",
    "scikit-learn>=1.6.1",
    "scanpy>=1.10.4",
    "scipy>=1.15.1",
    "spatialdata-plot>=0.2.9",
    "scyjava>=1.12.0",
    "pandas-stubs>=2.3.3",
    "scipy-stubs>=1.16.0.2",
    "hf-xet>=1.1.5",
    "datashader>=0.18.0",
]
tests = [
    "pytest>=8.3.4",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "pytest-env>=1.1.5",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "myst-nb>=1.1.2",
    "numpydoc>=1.8.0",
    "sphinx-book-theme>=1.1.3",
    "sphinx-contributors>=0.2.7",
    "sphinxcontrib-bibtex>=2.6.5",
    "myst-sphinx-gallery>=0.3.0",
    "sphinxext-opengraph>=0.11.0",
    "natsort>=8.4.0",
]
tutorials = [
    "igraph>=0.11.8",
    "ipywidgets>=8.1.5",
    "marsilea>=0.5.1",
    "parse>=1.20.2",
    "gseapy>=1.1.7",
    "mpl-fontkit>=0.5.1",
    "matplotlib-venn>=1.1.2",
    "muon>=0.1.7",
    "mofapy2>=0.7.2",
    "pypalettes>=0.1.5",
    "bokeh>=3.7.2",
    "dask-jobqueue>=0.9.0",
]
napari = [
    "napari[all]>=0.5.6",
    "napari-spatialdata>=0.5.5",
    "spatialdata-plot>=0.2.9",
]
model = [
    "einops>=0.8.1",
    "einops-exts>=0.0.4",
    "environs>=14.1.1",
    "sacremoses>=0.1.1",
    "conch",
    "open-clip-torch>=2.32.0",
    "transformers>=4.49.0",
    "cellpose>=4.0.0",
    "musk",
    "fairscale>=0.4.13",
    "sentencepiece>=0.2.1",
    "diffusers>=0.36.0",
    "accelerate>=1.12.0",
]


[tool.uv.sources]
lazyslide-models = { git = "https://github.com/rendeirolab/lazyslide-models.git", branch = "main" }
# lazyslide-models = { path = "../lazyslide-models", editable = true }
# wsidata = { git = "https://github.com/rendeirolab/wsidata", branch = "main" }
# wsidata = { path = "../wsidata", editable = true }
conch = { git = "https://github.com/mahmoodlab/CONCH.git" }
musk = { git = "https://github.com/lilab-stanford/MUSK.git" }

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning"
]
env = [
    "PYTORCH_ENABLE_MPS_FALLBACK=1"
]
